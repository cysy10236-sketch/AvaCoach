services:
  - type: web
    name: avacoach-api
    runtime: node
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      - key: CLIENT_ORIGIN
        sync: false
      - key: LLM_PROVIDER
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: TTS_PROVIDER
        sync: false
      - key: VOLCANO_TTS_ENABLED
        sync: false
      - key: VOLCANO_TTS_API_KEY
        sync: false
      - key: VOLCANO_TTS_RESOURCE_ID
        sync: false
      - key: VOLCANO_TTS_VOICE_TYPE
        sync: false
      - key: ASR_PROVIDER
        sync: false
      - key: VOLCANO_ASR_ENABLED
        sync: false
      - key: VOLCANO_ASR_API_KEY
        sync: false
      - key: VOLCANO_ASR_RESOURCE_ID
        sync: false
      - key: SPATIUS_API_KEY
        sync: false
      - key: SPATIUS_APP_ID
        sync: false
      - key: SPATIUS_REGION
        sync: false
